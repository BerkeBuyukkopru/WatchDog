services:
  # 1. Veritabanı Servisi
  watchdog-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: watchdog-sql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

  # 2. API Servisi
  watchdog-api:
    restart: always
    build:
      context: .
      dockerfile: backend/src/Presentation/Watchdog.Api/Dockerfile
    container_name: watchdog-api
    ports:
      - "${API_PORT}:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=watchdog-db;Database=${DB_NAME};User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
      - JwtSettings__SecretKey=${JWT_SECRET}
      - ASPNETCORE_ENVIRONMENT=Development
      - MailSettings__Host=watchdog-mail
      - MailSettings__ToEmail=${MAIL_TO_EMAIL:-admin@example.com}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - watchdog-db

  # 3. Worker Servisi
  watchdog-worker:
    restart: always
    build:
      context: .
      dockerfile: backend/src/Presentation/Watchdog.Worker/Dockerfile
    container_name: watchdog-worker
    environment:
      - ConnectionStrings__DefaultConnection=Server=watchdog-db;Database=${DB_NAME};User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_ENVIRONMENT=Development
      - MailSettings__Host=watchdog-mail
      - MailSettings__ToEmail=${MAIL_TO_EMAIL:-admin@example.com}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - watchdog-db
    volumes:
      - ./archives:/app/WatchDogArchives

  # 4. Frontend Servisi (Yeni)
  watchdog-ui:
    restart: always
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:${API_PORT}
    container_name: watchdog-ui
    ports:
      - "5174:80"
    depends_on:
      - watchdog-api

  # 5. MailHog Servisi (Yerel Mail Test Sunucusu)
  watchdog-mail:
    image: mailhog/mailhog:latest
    container_name: watchdog-mail
    ports:
      - "1025:1025" # SMTP Portu
      - "8025:8025" # Web Arayüzü (Dashboard)
    restart: always

volumes:
  sql_data:
